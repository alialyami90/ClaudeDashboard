# Builds and tests Claude Dashboard on every push and pull request, the same way as on the PC:
# scripts\build.ps1 -Test (the app, ClaudeHook.exe and their checks) and scripts\package.ps1 -Test (the setup exe and its
# sandboxed checks). Windows only: the Android app is parked until the Claude-only phone companion (decision 026).
# Changes that only touch Markdown, docs\ or the read-only spec don't start a run.
name: CI

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'design specfication/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'design specfication/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Windows build and checks
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      # Full history and tags: the builds take their version from the newest vX.Y.Z tag (git describe).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The pinned, hash-checked LibreHardwareMonitor files (decision 016), while the System stats widget still exists.
      # Optional: without them (or without the script) the app builds and says the sensors aren't installed.
      - name: Hardware sensor files
        continue-on-error: true
        run: if (Test-Path .\scripts\get-sensors.ps1) { .\scripts\get-sensors.ps1 }

      - name: App and checks
        run: .\scripts\build.ps1 -Test

      # TEMPORARY (icon redraw): draws the new icon with the app's own pixel art and prints it, to be committed.
      - name: Draw the icon
        run: |
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\scripts\make-icon.ps1 -PreviewDirectory artifacts\renders
          '----- ICON BASE64 BEGIN -----'
          $b = [Convert]::ToBase64String([IO.File]::ReadAllBytes('assets\ClaudeDashboard.ico'))
          for ($i = 0; $i -lt $b.Length; $i += 200) { 'ICO ' + $b.Substring($i, [Math]::Min(200, $b.Length - $i)) }
          '----- ICON BASE64 END -----'

      - name: Setup exe and checks
        run: .\scripts\package.ps1 -Test

      # Test builds for trying a branch.
      - name: Upload test builds
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: claude-dashboard-${{ github.sha }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            artifacts/app/ClaudeDashboard.exe
            artifacts/app/ClaudeDashboard.exe.config
            artifacts/app/ClaudeHook.exe
            artifacts/setup/*.exe
            artifacts/renders/*.png
