# Builds and tests the app on every push and pull request, the same way as on the PC:
# scripts\build.ps1 -Test (the app and its checks) and scripts\package.ps1 -Test (setup exe and its sandboxed checks).
# Changes that only touch Markdown, docs\ or the read-only spec don't start a run.
name: CI

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'design specfication/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'design specfication/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Windows tests
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      # Full history and tags: the builds take their version from the newest vX.Y.Z tag (git describe).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Windows app and checks
        run: .\scripts\build.ps1 -Test

      - name: Setup exe and checks
        run: .\scripts\package.ps1 -Test

      # Test builds for trying a branch.
      - name: Upload test builds
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: widget-screen-${{ github.sha }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            artifacts/app/WidgetScreen.exe
            artifacts/app/WidgetScreen.exe.config
            artifacts/app/ClaudeHook.exe
            artifacts/setup/*.exe
